name: PowerShell Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap developer modules
        shell: ${{ matrix.shell }}
        run: ./scripts/bootstrap-dev.ps1 -Scope CurrentUser

      - name: Lint
        shell: ${{ matrix.shell }}
        run: ./scripts/lint.ps1

      - name: Test
        shell: ${{ matrix.shell }}
        run: ./scripts/test.ps1 -ResultPath test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: test-results.xml
          if-no-files-found: warn
